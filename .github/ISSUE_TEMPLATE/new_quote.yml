name: ✨ 发布新金句 / 语录
description: 在手机端或网页端快速录入金句，自动解析并发布到网站
title: "【金句发布】"
labels: ["quote-publish"]
body:
  - type: textarea
    id: content
    attributes:
      label: 金句正文
      description: 请输入你想记录的金句或洞察思考（支持 Markdown）
      placeholder: "反过来想，总是反过来想..."
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: 来源 / 出处 / 作者
      description: 例如：查理·芒格 ·《穷查理宝典》
      placeholder: "查理·芒格 ·《穷查理宝典》"

  - type: checkboxes
    id: tags_select
    attributes:
      label: 常用标签（可快捷多选）
      options:
        - label: 思考
        - label: 读书笔记
        - label: 认知
        - label: 投资
        - label: 灵感
        - label: 哲学
        - label: 生活

  - type: input
    id: custom_tags
    attributes:
      label: 其它补充标签
      description: 多个标签请用逗号隔开，如：商业, 极简
      placeholder: "商业, 极简"

  - type: dropdown
    id: mood
    attributes:
      label: 心情 / 微标表情
      description: 选择一个符合金句气质的表情微标
      options:
        - "💡 (灵感/洞察)"
        - "📚 (阅读/摘录)"
        - "☕ (从容/生活)"
        - "🌌 (深邃/宇宙)"
        - "✍️ (随笔/记录)"
        - "🔥 (能量/激情)"
        - "🌱 (成长/蜕变)"

  - type: input
    id: custom_date
    attributes:
      label: 自定义发布时间（可选）
      description: 平时留空即可（留空自动使用当前精确提交时间）。若补发旧日记可填，如 2026-08-15 10:00
      placeholder: "留空默认当前时间"

  - type: checkboxes
    id: pinned
    attributes:
      label: 置顶设置
      options:
        - label: 📌 将此条金句置顶在首页最上方
